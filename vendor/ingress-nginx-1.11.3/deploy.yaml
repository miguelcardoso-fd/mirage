# ingress-nginx 1.11.3 -- vendored, and DELIBERATELY NOT UPSTREAM.
#
# Source: deploy/static/provider/baremetal/deploy.yaml at controller-v1.11.3
#   https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.3/deploy/static/provider/baremetal/deploy.yaml
#
# Two deviations from that file, both intentional:
#
# 1. The `baremetal` provider variant, not the `kind` one. The kind variant
#    binds hostPort 80/443 and requires `nodeSelector: ingress-ready=true`, a
#    label only a custom kind cluster config applies. kcd-lab reaches the
#    controller through `kubectl port-forward` instead (see api_start in
#    lib/common.sh), so hostPort buys nothing and the node label would force a
#    cluster recreate. baremetal needs neither, so ONE manifest serves both
#    kind and minikube.
#
# 2. The admission webhook is stripped: ValidatingWebhookConfiguration, both
#    certgen Jobs, their ServiceAccount/Role/ClusterRole/bindings, the
#    admission Service, the --validating-webhook* controller args, and the
#    cert volume/volumeMount. It only validates Ingress objects on admission;
#    this lab applies exactly one Ingress, from a file in this repo. Keeping it
#    costs ~30-60s of certgen on every setup and adds the "failed calling
#    webhook ... no endpoints available" race, where applying the Ingress fails
#    until the webhook has endpoints.
#
# Re-vendoring: refetch the baremetal deploy.yaml and re-apply both deviations.

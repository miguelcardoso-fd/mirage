---
# Source cluster — KRaft, single dual-role node, ephemeral storage.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: source-pool
  namespace: mirage
  labels:
    strimzi.io/cluster: kafka-source
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-source
  namespace: mirage
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
    resources:
      requests:
        memory: 1536Mi
        cpu: "200m"
      limits:
        memory: 1536Mi
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: "50m"
        limits:
          memory: 256Mi
---
# Target cluster.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: target-pool
  namespace: mirage
  labels:
    strimzi.io/cluster: kafka-target
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-target
  namespace: mirage
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      # Plaintext, used by the default baseline connector.
      - name: plain
        port: 9092
        type: internal
        tls: false
      # TLS + SASL/SCRAM, so the auth labs have a listener that can actually
      # reject bad credentials. Production KCD talks TLS cross-cluster, so this
      # also makes the lab closer to the real thing.
      - name: scram
        port: 9094
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    # Enables ACL enforcement so an authorization lab is possible. ANONYMOUS is
    # a superuser so the plaintext listener (which every other lab uses) keeps
    # full access and is completely unaffected.
    authorization:
      type: simple
      superUsers:
        - ANONYMOUS
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
    resources:
      requests:
        memory: 1536Mi
        cpu: "200m"
      limits:
        memory: 1536Mi
  entityOperator:
    # Strimzi's default entity-operator memory is too small once BOTH the topic
    # and user operators run on a constrained kind node — they OOMKill (exit
    # 137) and crashloop, which stops KafkaTopic/KafkaUser reconciliation.
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: "50m"
        limits:
          memory: 256Mi
    # Required for KafkaUser -> Secret reconciliation, which the auth labs need.
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: "50m"
        limits:
          memory: 256Mi
